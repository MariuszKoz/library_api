# Local development environment. Usage: see docs/development/docker_compose.md
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      # Bound to localhost only; 5433 by default to avoid clashing with a local PostgreSQL
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 5s
      retries: 15

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    # Install gems added after the image was built, drop a stale pid, prepare the database, start the server
    command: bash -c "bundle check > /dev/null || bundle install; rm -f tmp/pids/server.pid && bin/rails db:prepare && bin/rails server -b 0.0.0.0"
    environment:
      # DB_* instead of DATABASE_URL, so the queue database gets the host too
      DB_HOST: db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      # Run the Solid Queue supervisor (workers, dispatcher, recurring scheduler) inside Puma
      SOLID_QUEUE_IN_PUMA: "1"
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  bundle:
